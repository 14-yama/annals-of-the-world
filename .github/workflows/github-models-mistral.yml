name: GitHub Models — Mistral-Nemo (Class 6 · Events)

# Free Mistral-Nemo 12B model — separate quota from all other GH Models bots.
# Targets Class 6 (Events/Movements) stubs: 610–694 divisions.
# Rate limits (free tier): 15 RPM, 150 RPD per model per token.
# At 20 entities/run × 6 runs/day = 120 entities/day (under 150 cap).
#
# Mistral-Nemo is a 12B model — higher quality than Phi-4-mini/Llama-8B;
# runs strict mode (no --lenient) to produce richer event summaries.

on:
  schedule:
    - cron: '0 1,5,9,13,17,21 * * *'   # 6×/day at odd hours — no collision with Gemini's top-of-hour runs
  workflow_dispatch:
    inputs:
      count:
        description: "Entities to enrich"
        type: string
        default: "20"

concurrency:
  group: gh-models-mistral
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      models: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean/audit-system
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Class-6 (Events) queue
        run: |
          python3 << 'PYEOF'
          import json, sys, time
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from enrichment_queue import score_entity

          BASE = Path('data/appwrite-export/entities')
          items = []
          for d in sorted(BASE.iterdir()):
              dn = d.name
              if not (dn.startswith('6') and (len(dn) > 1 and (dn[1].isdigit() or dn[1] == '-'))):
                  continue
              for f in d.glob('*.json'):
                  try:
                      raw = json.loads(f.read_text())
                      for ent in raw.get('entities', []):
                          score = score_entity(ent)
                          if score <= 0: continue
                          items.append({
                              'slug': ent.get('slug', ''),
                              'name': ent.get('name', ''),
                              'label': ent.get('label', ''),
                              'era': ent.get('era', ''),
                              'region': ent.get('region', ''),
                              'continent': ent.get('continent', ''),
                              'importanceScore': ent.get('importanceScore', 1) or 1,
                              'summaryLength': len(ent.get('summary', '') or ''),
                              'score': score,
                              'filepath': str(f),
                          })
                  except Exception:
                      pass

          items.sort(key=lambda x: x['score'], reverse=True)
          out = {
              'generated': time.strftime('%Y-%m-%dT%H:%M:%SZ'),
              'class': '6-Events',
              'model': 'Mistral-Nemo',
              'count': min(300, len(items)),
              'queue': items[:300],
          }
          Path('data/enrichment').mkdir(parents=True, exist_ok=True)
          Path('data/enrichment/queue_class6.json').write_text(json.dumps(out, indent=2))
          print(f'Class 6 queue: {len(items)} stubs, top 300 written')
          PYEOF

      - name: Run Mistral-Nemo enrichment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT="${{ github.event.inputs.count || '20' }}"
          echo "Mistral-Nemo enrichment: ${COUNT} Class-6 (Events) stubs"

          timeout 2400 python3 -u scripts/ai_enrich_autonomous.py \
            --model github \
            --github-model Mistral-Nemo \
            --queue data/enrichment/queue_class6.json \
            --count "${COUNT}" \
            --min-score 0 \
            --retry 1 || echo "Enrichment exited non-zero — continuing to commit partial results"

      - name: Commit + push
        run: |
          git config user.name  "Mistral-Nemo Bot"
          git config user.email "mistral@annals-of-the-world.bot"
          git add data/appwrite-export/entities/ data/enrichment/ || true
          CHANGED=$(git diff --cached --name-only | wc -l)
          if [ "$CHANGED" -gt 0 ]; then
            git commit -m "feat(data): Mistral-Nemo enrichment — ${CHANGED} files (Class 6 · Events)

          Workflow: gh-models-mistral · Run: ${{ github.run_id }}"
            for attempt in 1 2 3 4 5; do
              if git push; then echo "✓ Push attempt $attempt succeeded"; break; fi
              git pull --rebase -X ours --autostash origin clean/audit-system || git rebase --abort || true
              sleep $((attempt * 3))
              [ "$attempt" = "5" ] && exit 1 || true
            done
          else
            echo "No changes to commit"
          fi

      - name: Write status file
        if: always()
        run: |
          mkdir -p data/governance
          cat > data/governance/last_mistral_run.json << EOF
          {
            "workflow": "gh-models-mistral",
            "model": "Mistral-Nemo",
            "class": "6-Events",
            "run_id": "${{ github.run_id }}",
            "status": "${{ job.status }}",
            "completedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git add data/governance/last_mistral_run.json || true
          git diff --cached --quiet || git commit -m "chore: mistral run status" || true
          git push || true
