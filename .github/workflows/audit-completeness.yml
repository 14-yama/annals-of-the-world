name: Audit — Completeness

on:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Run completeness audit (git-first, zero Appwrite reads)
        run: python3 -m scripts.audits.completeness
      - name: Commit report
        run: |
          git config user.name  "Annals Audit Bot"
          git config user.email "audit-bot@annals-of-the-world.bot"
          git add data/audit-reports/completeness.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(audit): completeness report"
            git push
          else
            echo "No changes."
          fi
