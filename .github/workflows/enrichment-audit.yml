name: Enrichment Audit

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual trigger'

concurrency:
  group: enrichment-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Run Enrichment Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run enrichment audit
        run: python3 scripts/audit_enrichment.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Push audit to Appwrite
        env:
          VITE_APPWRITE_ENDPOINT:    https://fra.cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID:  ${{ secrets.VITE_APPWRITE_PROJECT_ID }}
          VITE_APPWRITE_DATABASE_ID: annals_world_db
          APPWRITE_API_KEY:          ${{ secrets.APPWRITE_API_KEY }}
        run: npx tsx scripts/push_enrichment_audit.ts

      - name: Record last audit run
        run: |
          mkdir -p data/governance
          echo '{
            "lastAuditAt": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
            "workflow": "enrichment-audit",
            "runId": "${{ github.run_id }}",
            "trigger": "${{ github.event_name }}"
          }' > data/governance/last_enrichment_audit_run.json

      - name: Commit updated audit files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/governance/enrichment_audit.json data/governance/last_enrichment_audit_run.json || true
          if git diff --cached --quiet; then
            echo "No audit file changes to commit"
          else
            git commit -m "chore(audit): enrichment audit $(date -u +%Y-%m-%d)"
            git push
          fi
