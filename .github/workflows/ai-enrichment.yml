name: AI Entity Enrichment (git-first)

# Bot writes JSON only. The sync_gateway workflow pushes to Appwrite later.
on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours — keep cloud bot busy (Gemini free tier handles this)
  push:
    branches: [clean/audit-system]
    paths:
      - 'scripts/ai_enrich_autonomous.py'
      - 'scripts/enrichment_queue.py'
      - '.github/workflows/ai-enrichment.yml'
  workflow_dispatch:
    inputs:
      count:
        description: "Number of entities to enrich per run"
        default: "25"
        type: string
      model:
        description: "LLM provider"
        type: choice
        options:
          - gemini
          - openai
        default: gemini
      dry_run:
        description: "Preview only — no file changes"
        type: boolean
        default: false
      min_importance:
        description: "Minimum importanceScore filter for queue"
        default: "0"
        type: string

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean/audit-system   # always enrich from the working branch
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Gemini API key present (failsafe)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Both GEMINI_API_KEY and OPENAI_API_KEY are missing from repo secrets!"
            echo "::error::Add at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY missing — will use OpenAI fallback only"
          else
            echo "✓ GEMINI_API_KEY present ($(echo -n "$GEMINI_API_KEY" | wc -c) chars)"
          fi
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "✓ OPENAI_API_KEY present (fallback ready)"
          fi

      - name: Generate enrichment queue
        run: |
          python3 scripts/enrichment_queue.py \
            --min-importance ${{ github.event.inputs.min_importance || '0' }} \
            --limit 1000

      - name: Enrich entities via LLM (writes git only)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MODEL="${{ github.event.inputs.model || 'gemini' }}"
          COUNT="${{ github.event.inputs.count || '25' }}"
          OTHER="gemini"; [ "$MODEL" = "gemini" ] && OTHER="openai"

          # Primary provider
          if python3 scripts/ai_enrich_autonomous.py \
              --count "$COUNT" --model "$MODEL" --retry 2; then
            echo "✓ $MODEL completed successfully"
          else
            echo "::warning::$MODEL failed — attempting $OTHER fallback in-line"
            python3 scripts/ai_enrich_autonomous.py \
              --count "$COUNT" --model "$OTHER" --retry 2 --lenient || \
              echo "::error::Both providers failed; ai-enrichment-retry.yml will catch this on completion"
          fi

      - name: Dry run preview
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          python3 scripts/ai_enrich_autonomous.py \
            --count ${{ github.event.inputs.count || '25' }} \
            --model ${{ github.event.inputs.model || 'gemini' }} \
            --dry-run

      - name: Commit enriched entity files
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "AI Enrichment Bot"
          git config user.email "ai-enrichment@annals-of-the-world.bot"
          # Write cloud bot status for OllamaMonitor UI
          python3 scripts/_workflow_write_run_status.py "AI Entity Enrichment (git-first)" success
          git add data/appwrite-export/entities/ data/enrichment/last_run.json data/governance/last_github_runs.json
          CHANGED=$(git diff --cached --name-only | wc -l)
          if [ "$CHANGED" -gt 0 ]; then
            MODEL="${{ github.event.inputs.model || 'gemini' }}"
            git commit -m "feat(data): AI enrichment — ${CHANGED} entities enriched (sync_gateway will push to Appwrite)

          Automated enrichment via ${MODEL} LLM.
          Pipeline: ai-enrichment.yml | Run: ${{ github.run_id }}"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### AI Enrichment Results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/enrichment/last_run.json ]; then
            python3 -c "
          import json
          d = json.load(open('data/enrichment/last_run.json'))
          print(f\"| Metric | Value |\")
          print(f\"|--------|-------|\")
          print(f\"| Model | {d.get('model', 'unknown')} |\")
          print(f\"| Requested | {d.get('count_requested', 0)} |\")
          print(f\"| Enriched | {d.get('enriched', 0)} |\")
          print(f\"| Failed | {d.get('failed', 0)} |\")
          print(f\"| Dry Run | {d.get('dry_run', False)} |\")
          print(f\"| Note | Appwrite sync handled by sync_gateway workflow |\")
          " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No enrichment report found" >> "$GITHUB_STEP_SUMMARY"
          fi
