name: Sync Gateway — git → Appwrite

# Single writer to Appwrite. Reads data/appwrite-export/, computes diff vs
# last_sync.json, honours data/governance/budget.json caps, replays
# _editLog[] entries into audit_log, then commits cleared local files.

on:
  # Auto-trigger when AI enrichment workflow completes successfully
  workflow_run:
    workflows: ["AI Entity Enrichment (git-first)"]
    types: [completed]
    branches: [main, clean/audit-system]
  schedule:
    - cron: '0 7 * * *'   # daily 07:00 UTC, after audits/enrichment commit
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        type: boolean
        default: false
      full:
        description: 'Full sync (ignore last_sync.json)'
        type: boolean
        default: false
      max_writes:
        description: 'Override perRunWriteCap'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip if triggered by a failed enrichment run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean/audit-system   # always sync from the working branch
          fetch-depth: 0   # need history for git diff against last_sync commit
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install tsx
        run: npm install -g tsx
      - name: Run sync gateway (entities)
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          SYNC_EDITOR_ID: 'sync-gateway:github-action'
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${{ inputs.full }}" = "true" ]; then ARGS+=(--full); fi
          if [ -n "${{ inputs.max_writes }}" ]; then ARGS+=(--max=${{ inputs.max_writes }}); fi
          npx tsx scripts/sync_gateway.ts "${ARGS[@]}"
      - name: Run sync edges (relationships collection)
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          VITE_APPWRITE_ENDPOINT: 'https://fra.cloud.appwrite.io/v1'
          VITE_APPWRITE_PROJECT_ID: '66509ba7003618a05af6'
          VITE_APPWRITE_DATABASE_ID: 'annals_world_db'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/sync_edges.ts --dry-run
          else
            npx tsx scripts/sync_edges.ts --max=200
          fi
      - name: Commit budget + last_sync state
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name  "Annals Sync Gateway"
          git config user.email "sync-gateway@annals-of-the-world.bot"
          # Write last_github_runs.json so local OllamaMonitor can show cloud bot status
          python3 scripts/_workflow_write_run_status.py "Sync Gateway — git → Appwrite" success
          git add data/governance/budget.json data/governance/last_sync.json data/governance/last_github_runs.json data/appwrite-export/entities/ data/appwrite-export/edges/
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): gateway run — state + cleared _editLog + edges synced"
            for attempt in 1 2 3 4 5; do
              if git push; then echo "✓ Push attempt $attempt succeeded"; break; fi
              echo "⚠ Push attempt $attempt rejected; rebasing and retrying"
              git pull --rebase -X ours --autostash origin clean/audit-system || git rebase --abort || true
              sleep $((attempt * 3))
              if [ "$attempt" = "5" ]; then echo "✗ Push failed after 5 attempts"; exit 1; fi
            done
          else
            echo "No state changes."
          fi
