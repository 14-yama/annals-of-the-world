name: Audit — Duplicates

on:
  schedule:
    - cron: '0 5 * * 0'   # weekly Sun 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m scripts.audits.duplicates
      - name: Commit report
        run: |
          git config user.name  "Annals Audit Bot"
          git config user.email "audit-bot@annals-of-the-world.bot"
          git add data/audit-reports/duplicates.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(audit): duplicates report"
            git push
          else
            echo "No changes."
          fi
