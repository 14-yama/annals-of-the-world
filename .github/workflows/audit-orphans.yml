name: Audit — Orphans

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean/audit-system
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m scripts.audits.orphans
      - name: Commit report
        run: |
          git config user.name  "Annals Audit Bot"
          git config user.email "audit-bot@annals-of-the-world.bot"
          git add data/audit-reports/orphans.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(audit): orphans report"
            git push
          else
            echo "No changes."
          fi
