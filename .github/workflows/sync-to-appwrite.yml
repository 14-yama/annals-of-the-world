name: Sync Repo → Appwrite

on:
  push:
    branches: [clean/audit-system, main]
    paths:
      - 'data/appwrite-export/entities/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: |
          cd ui && npm ci --ignore-scripts

      - name: Detect changed entity files
        id: changed
        run: |
          # Get changed JSON files in the export directory
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'data/appwrite-export/entities/**/*.json' || true)
          if [ -z "$CHANGED" ]; then
            echo "No entity files changed — skipping sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(echo "$CHANGED" | wc -l)
            echo "Changed entity files: $COUNT"
            echo "$CHANGED"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync changed entities to Appwrite
        if: steps.changed.outputs.skip != 'true'
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 66509ba7003618a05af6
          APPWRITE_DATABASE_ID: annals_world_db
          SYNC_EDITOR_ID: github-actions
        run: |
          npx tsx scripts/sync_repo_to_appwrite.ts 2>&1 | tail -20

      - name: Summary
        if: always()
        run: |
          echo "### Sync Results" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changed.outputs.skip }}" = "true" ]; then
            echo "No entity files changed — sync skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Changed files: ${{ steps.changed.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Sync completed" >> "$GITHUB_STEP_SUMMARY"
          fi
